
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CONTIGO | Iniciar sesión</title>

    <!-- Diseño original del inicio de sesión -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >

    <!-- Adaptación a celulares -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}"
    >

    <style>
        /* Mensajes integrados en CONTIGO */

        #mensaje-login {
            margin: 16px 0;
            padding: 12px 15px;

            background: #FFF0F3;
            border: 1px solid #F4C9D7;
            border-radius: 13px;

            color: #963D59;

            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        #mensaje-login[hidden] {
            display: none !important;
        }

        #form-login button:disabled {
            opacity: 0.65;
            cursor: wait;
        }
    </style>

    <script
        src="{{ url_for('static', filename='js/login.js', v='recuperacion-1') }}"
        defer
    ></script>

</head>

<body>

    <main class="contenedor-login">

        <!-- Nombre de CONTIGO -->

        <h1>CONTIGO</h1>

        <!-- Zorrito oficial -->

        <img
            src="{{ url_for('static', filename='img/logo-contigo.jpeg') }}"
            alt="Zorrito oficial de CONTIGO abrazando un corazón"
            class="logo-contigo"
        >

        <h2>Iniciar sesión</h2>

        <!-- Formulario de ingreso -->

        <form id="form-login">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                maxlength="150"
                required
            >

            <label for="contrasena">
                Contraseña
            </label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <!-- Recuperación de contraseña -->

            <a
                href="{{ url_for('pantalla_recuperar_contrasena') }}"
                class="olvidar-contrasena"
            >
                ¿Olvidaste tu contraseña?
            </a>

            <!-- Mensaje sin ventanas del navegador -->

            <p
                id="mensaje-login"
                role="alert"
                aria-live="polite"
                hidden
            ></p>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p class="registro">
            ¿No tienes una cuenta?

            <a href="{{ url_for('registro') }}">
                Regístrate aquí
            </a>
        </p>

    </main>

</body>
</html>
