<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CONTIGO | Iniciar sesión</title>

    <!-- PWA Universal (Celulares Android, Tablets, Windows y Mac) -->
    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.webmanifest') }}"
    >
    <meta name="theme-color" content="#9867ce">

    <!-- Soporte App Nativa en iPhone y iPad (iOS / iPadOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CONTIGO">
    <link
        rel="apple-touch-icon"
        sizes="512x512"
        href="{{ url_for('static', filename='img/icono-contigo-512.png') }}"
    >

    <!-- Diseño original del inicio de sesión -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >

    <!-- Adaptación a celulares -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}"
    >

    <style>
        /* Mensajes integrados en CONTIGO */

        #mensaje-login {
            margin: 16px 0;
            padding: 12px 15px;

            background: #FFF0F3;
            border: 1px solid #F4C9D7;
            border-radius: 13px;

            color: #963D59;

            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        #mensaje-login[hidden],
        #guia-instalacion-manual[hidden] {
            display: none !important;
        }

        #form-login button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        /* Acceso rápido para instalación PWA */

        .contenedor-accesos-rapidos {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #ece3f7;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        #btn-instalar-app {
            width: 100%;
            background: linear-gradient(135deg, #9867ce, #7c4dbd);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-family: inherit;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(152, 103, 206, 0.28);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        #btn-instalar-app:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(152, 103, 206, 0.36);
        }

        #guia-instalacion-manual {
            margin-top: 4px;
            padding: 13px 15px;
            background: #f8f4ff;
            border: 1px solid #e5d9f3;
            border-radius: 12px;
            font-size: 13.5px;
            color: #483068;
            line-height: 1.55;
            text-align: left;
        }
    </style>

    <script
        src="{{ url_for('static', filename='js/login.js', v='demo-2') }}"
        defer
    ></script>

</head>

<body>

    <main class="contenedor-login">

        <!-- Nombre de CONTIGO -->

        <h1>CONTIGO</h1>

        <!-- Zorrito oficial -->

        <img
            src="{{ url_for('static', filename='img/logo-contigo.jpeg') }}"
            alt="Zorrito oficial de CONTIGO abrazando un corazón"
            class="logo-contigo"
        >

        <h2>Iniciar sesión</h2>

        <!-- Formulario de ingreso -->

        <form id="form-login">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                maxlength="150"
                required
            >

            <label for="contrasena">
                Contraseña
            </label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <!-- Recuperación de contraseña -->

            <a
                href="{{ url_for('pantalla_recuperar_contrasena') }}"
                class="olvidar-contrasena"
            >
                ¿Olvidaste tu contraseña?
            </a>

            <!-- Mensaje sin ventanas del navegador -->

            <p
                id="mensaje-login"
                role="alert"
                aria-live="polite"
                hidden
            ></p>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p class="registro">
            ¿No tienes una cuenta?

            <a href="{{ url_for('registro') }}">
                Regístrate aquí
            </a>
        </p>

        <!-- Acceso rápido: Instalador PWA -->

        <div class="contenedor-accesos-rapidos">

            <button
                type="button"
                id="btn-instalar-app"
            >
                📲 Instalar app CONTIGO ahora
            </button>

            <div
                id="guia-instalacion-manual"
                hidden
            ></div>

        </div>

    </main>

    <!-- Registro del Service Worker y control del botón inteligente PWA -->

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch((err) => {
                    console.error("Error al registrar Service Worker:", err);
                });
            });
        }

        let eventoInstalacion = null;
        const btnInstalar = document.getElementById("btn-instalar-app");
        const guiaManual = document.getElementById("guia-instalacion-manual");

        const yaInstalada =
            window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;

        if (yaInstalada && btnInstalar) {
            btnInstalar.style.display = "none";
        }

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            eventoInstalacion = e;
            if (btnInstalar) {
                btnInstalar.textContent = "📲 Instalar app CONTIGO ahora";
            }
        });

        window.addEventListener("appinstalled", () => {
            if (btnInstalar) btnInstalar.style.display = "none";
            if (guiaManual) guiaManual.hidden = true;
            eventoInstalacion = null;
        });

        if (btnInstalar) {
            btnInstalar.addEventListener("click", async () => {
                if (eventoInstalacion) {
                    eventoInstalacion.prompt();
                    const eleccion = await eventoInstalacion.userChoice;
                    if (eleccion.outcome === "accepted") {
                        btnInstalar.style.display = "none";
                    }
                    eventoInstalacion = null;
                    return;
                }

                if (!guiaManual) return;

                const ua = window.navigator.userAgent;
                const esIos =
                    /iphone|ipad|ipod/i.test(ua) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
                const esAndroid = /android/i.test(ua);

                if (esIos) {
                    guiaManual.innerHTML =
                        '📱 <strong>En iPhone o iPad (Safari):</strong><br>' +
                        '1. Toca el botón <strong>Compartir</strong> (cuadro con flecha hacia arriba).<br>' +
                        '2. Selecciona <strong>"Agregar a inicio"</strong> y pulsa <strong>Agregar</strong>.';
                } else if (esAndroid) {
                    guiaManual.innerHTML =
                        '📱 <strong>En celular o tablet Android:</strong><br>' +
                        '1. Toca los <strong>3 puntos (⋮)</strong> arriba a la derecha en Chrome.<br>' +
                        '2. Selecciona <strong>"Instalar aplicación"</strong> o <strong>"Agregar a pantalla principal"</strong>.';
                } else {
                    guiaManual.innerHTML =
                        '💻 <strong>En computador (Chrome / Edge):</strong><br>' +
                        'Haz clic en el ícono de <strong>instalar app (⊕)</strong> en la barra de direcciones arriba a la derecha (si ya la tienes instalada, ábrela desde tu menú de aplicaciones).';
                }

                guiaManual.hidden = !guiaManual.hidden;
            });
        }
    </script>

</body>
</html>
