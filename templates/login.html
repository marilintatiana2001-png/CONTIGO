
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CONTIGO | Iniciar sesión</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <main class="contenedor-login">

        <!-- Nombre de la aplicación -->
        <h1>CONTIGO </h1>

        <!-- Logo original de CONTIGO -->
        <img
            src="{{ url_for('static', filename='img/logo-contigo.jpeg') }}"
            alt="Zorrito oficial de CONTIGO abrazando un corazón"
            class="logo-contigo"
        >

        <!-- Inicio de sesión -->
        <h2>Iniciar sesión</h2>

        <form id="form-login">

            <!-- Correo electrónico -->
            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                required
            >

            <!-- Contraseña -->
            <label for="contrasena">
                Contraseña
            </label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <!-- Recuperar contraseña -->
            <a href="#" class="olvidar-contrasena">
                ¿Olvidaste tu contraseña?
            </a>

            <!-- Botón de ingreso -->
            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <!-- Registro de nuevos usuarios -->
        <p class="registro">
            ¿No tienes una cuenta?
            <a href="{{ url_for('registro') }}">
                Regístrate aquí
            </a>
        </p>

    </main>

    <!-- JavaScript -->
    <script
        src="{{ url_for('static', filename='js/login.js') }}">
    </script>

</body>
</html>
