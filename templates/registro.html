
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CONTIGO | Crear cuenta</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <main class="contenedor-login">

        <!-- Logo oficial -->
        <img
            src="{{ url_for('static', filename='img/logo-contigo.jpeg') }}"
            alt="Zorrito oficial de CONTIGO"
            class="logo-contigo"
        >

        <h1>CONTIGO</h1>

        <p class="descripcion">
            Con tus emociones, con tu historia, CONTIGO.
        </p>

        <h2>Crear cuenta</h2>

        <form id="form-registro">

            <label for="nombre">
                Nombre completo
            </label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="100"
                autocomplete="name"
                placeholder="Escribe tu nombre"
                required
            >

            <label for="correo">
                Correo electrónico
            </label>
            <input
                type="email"
                id="correo"
                name="correo"
                maxlength="150"
                autocomplete="email"
                placeholder="Ingresa tu correo"
                required
            >

            <label for="fecha_nacimiento">
                Fecha de nacimiento
            </label>
            <input
                type="date"
                id="fecha_nacimiento"
                name="fecha_nacimiento"
                autocomplete="bday"
            >

            <label for="contrasena">
                Contraseña
            </label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                minlength="8"
                autocomplete="new-password"
                placeholder="Mínimo 8 caracteres"
                required
            >

            <label for="confirmar_contrasena">
                Confirmar contraseña
            </label>
            <input
                type="password"
                id="confirmar_contrasena"
                name="confirmar_contrasena"
                minlength="8"
                autocomplete="new-password"
                placeholder="Repite tu contraseña"
                required
            >

            <p id="mensaje-registro"
               class="mensaje-registro"
               role="status"
               aria-live="polite"></p>

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <p class="registro">
            ¿Ya tienes una cuenta?
            <a href="{{ url_for('inicio') }}">
                Inicia sesión
            </a>
        </p>

    </main>

    <script src="{{ url_for('static', filename='js/registro.js') }}"></script>

</body>
</html>
